[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irs-transcript"
version = "0.1.0"
description = "Local, deterministic IRS transcript extraction for tax return tie-out"
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11.0"]

[project.scripts]
irs-transcript = "irs_transcript.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
